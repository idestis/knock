# git-cliff: CHANGELOG.md from Conventional Commits, the full developer history.
# One version for the app, CLI and relay; tags are vX.Y.Z.
# User-facing notes use their own configs: scripts/cliff-release.toml (GitHub release)
# and scripts/cliff-sparkle.toml (the appcast's HTML).
# A "Release-note:" footer replaces a commit's line everywhere; "Release-note: none" hides it.

[changelog]
header = """
# Changelog

All notable changes to Knock. Generated by [git-cliff](https://git-cliff.org) from Conventional Commits.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
{% set note = commit.footers | filter(attribute="token", value="Release-note") | first %}\
{% if not note or note.value | lower != "none" %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{% if note %}{{ note.value | upper_first }}{% else %}{{ commit.message | upper_first }}{% endif %} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/idestis/knock/commit/{{ commit.id }}))\
{% endif %}\
{%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  # Squash merges end in "(#12)"; link the PR instead of leaving a bare number.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/idestis/knock/pull/${1}))" },
]
# The <!-- nn --> prefix only orders the groups (zero-padded so 10 sorts after 09).
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^security", group = "<!-- 03 -->Security" },
  { body = ".*security", group = "<!-- 03 -->Security" },
  { message = "^refactor", group = "<!-- 04 -->Refactoring" },
  { message = "^docs?", group = "<!-- 05 -->Documentation" },
  { message = "^test", group = "<!-- 06 -->Tests" },
  { message = "^build", group = "<!-- 07 -->Build and dev environment" },
  { message = "^ci", group = "<!-- 08 -->CI" },
  { message = "^chore\\(deps", group = "<!-- 09 -->Dependencies" },
  { message = "^chore|^style", group = "<!-- 10 -->Chores" },
  { message = "^revert", group = "<!-- 11 -->Reverts" },
]

[bump]
# The first release, when no v* tag exists yet.
initial_tag = "v0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = false

# git-cliff: changelog and release notes from Conventional Commits.
# One version for the app, CLI and relay; tags are vX.Y.Z.
# A "Release-note:" footer overrides a commit's line; "Release-note: none" hides it.

[changelog]
header = """
# Changelog\n
All notable changes to Knock. Generated by git-cliff from Conventional Commits.\n
"""
body = """
{%- macro remote_url() -%}
  https://github.com/Carmoola/1password-transit
{%- endmacro -%}

{% if version -%}
    ## [{{ version | split(pat="-v") | last }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
            {{ commit.message | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
            {%- if commit.breaking %} **BREAKING**{% endif %}
    {%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Group names: the <!-- n --> prefix only orders them. The appcast template keys off the
# visible names (Features, Bug Fixes, Performance), so keep those stable.
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactor" },
    { message = "^build|^deps|^bump", group = "<!-- 4 -->Build and dependencies" },
    { message = "^doc", group = "<!-- 5 -->Documentation" },
    { message = "^style", group = "<!-- 6 -->Styling" },
    { message = "^test", group = "<!-- 7 -->Testing" },
    { message = "^revert", group = "<!-- 8 -->Revert" },
    { message = "^security", group = "<!-- 9 -->Security" },
    { message = "^chore|^ci", group = "<!-- 10 -->Miscellaneous" },
    { body = ".*security", group = "<!-- 9 -->Security" },
]
protect_breaking_commits = false
filter_commits = false
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false

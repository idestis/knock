{{- if include "knock-relay.needsSecret" . }}
{{- $name := include "knock-relay.secretName" . }}
{{- $a := .Values.auth }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knock-relay.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.tokenSecret.existingSecret }}
  {{- if .Values.tokenSecret.value }}
  token-secret: {{ .Values.tokenSecret.value | b64enc | quote }}
  {{- else }}
  {{- /* Generated once, then reused from the live Secret so sign-ins survive upgrades. */}}
  {{- $live := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $live $live.data (hasKey $live.data "token-secret") }}
  token-secret: {{ index $live.data "token-secret" | quote }}
  {{- else }}
  token-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $a.google.clientId (not $a.google.existingSecret) }}
  google-client-id: {{ $a.google.clientId | b64enc | quote }}
  google-client-secret: {{ $a.google.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if and $a.github.clientId (not $a.github.existingSecret) }}
  github-client-id: {{ $a.github.clientId | b64enc | quote }}
  github-client-secret: {{ $a.github.clientSecret | b64enc | quote }}
  {{- end }}
{{- end }}

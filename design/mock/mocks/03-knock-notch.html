<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knock: someone knocks (notch)</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#c9ced8}
.frame{width:1000px;height:520px;border-radius:26px;box-shadow:0 30px 80px rgba(15,23,42,0.28),0 0 0 1px rgba(0,0,0,0.08)}
</style>
</head>
<body>
<div class="frame">
<div style="position: relative; width: 1000px; height: 520px; overflow: hidden; border-radius: 26px; background: radial-gradient(900px 520px at 12% 115%, #8fb0ff 0%, rgba(143,176,255,0) 60%), radial-gradient(760px 480px at 92% -10%, #071a66 0%, rgba(7,26,102,0) 65%), linear-gradient(160deg, #0a1a4f 0%, #1846c9 55%, #6f93ff 100%); color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px; line-height: 18px">

<div style="position: absolute; top: 0; left: 0; width: 1000px; height: 34px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.14); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); font-weight: 500">
<div style="display: flex; align-items: center; gap: 18px"><span style="font-weight: 700">Knock</span><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span></div>
<div style="display: flex; align-items: center; gap: 14px"><img src="../assets/knock-k-white.png" alt="Knock menu bar icon" style="width: 14px; height: 14px; display: block"><span style="font-variant-numeric: tabular-nums">Fri 13 Nov 17:42</span></div>
</div>

<section aria-labelledby="notch-title" style="position: absolute; top: 0; left: 280px; width: 440px; box-sizing: border-box; padding: 46px 18px 18px 18px; display: flex; flex-direction: column; gap: 16px; background: #000000; border-radius: 0 0 32px 32px; box-shadow: 0 18px 50px rgba(0,0,0,0.45)">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 100px; background: #1f3fae; font-size: 15px; line-height: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center">SC</span>
<div style="display: flex; flex-direction: column; min-width: 0">
<h1 id="notch-title" style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 600">Knock, knock.</h1>
<p style="margin: 0; font-size: 12px; line-height: 16px; color: #c7c9d1">Sam Carter wants to come in from sam-mbp.</p>
<p style="margin: 3px 0 0 0; display: flex; align-items: center; gap: 5px; font-size: 11px; line-height: 14px; color: #9a9ca6"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1.5l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3 1 3-2.6 1.9-1 3-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3-1-3 2.6-1.9 1-3 3.2.1z"/><path d="M8 12.2l2.6 2.6L16.2 9" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>sam@carter.dev · GitHub</span></p>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 40px; border: 0; border-radius: 100px; background: rgba(255,255,255,0.16); color: #ffffff; font-family: inherit; font-size: 13px; line-height: 18px; font-weight: 600; cursor: pointer">Not now</button>
<button type="button" style="height: 40px; border: 0; border-radius: 100px; background: #2f6bff; color: #ffffff; font-family: inherit; font-size: 13px; line-height: 18px; font-weight: 600; cursor: pointer">Let Sam in</button>
</div>
</section>

</div>
</div>

</body>
</html>

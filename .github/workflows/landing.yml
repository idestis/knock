name: landing

# Build-only check for pull requests that touch the landing page.
# Deploys happen in pages.yml, on pushes to main only.
on:
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/landing.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run build

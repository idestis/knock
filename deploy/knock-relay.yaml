# knock-relay on Kubernetes. Apply with: kubectl apply -f deploy/knock-relay.yaml
#
# The Helm chart is the preferred install (charts/knock-relay):
#   helm install knock-relay oci://ghcr.io/idestis/charts/knock-relay --version <release> -f values.yaml
# This manifest stays for anyone who'd rather not use Helm.
#
# Run ONE replica: knocks and live sessions live in the pod (pod-to-pod
# forwarding isn't built yet; DESIGN.md section 8). Door registrations (which
# key holds each door id) are in memory by default and forgotten on restart;
# hosts win their ids back with signed claims, which need a stable
# KNOCK_TOKEN_SECRET. To keep them across restarts, set KNOCK_STORE=valkey and
# KNOCK_VALKEY_URL in the Secret below.
# Expose it only on your tailnet (Tailscale operator below) or an internal LB.
apiVersion: v1
kind: Namespace
metadata:
  name: knock
---
apiVersion: v1
kind: Secret
metadata:
  name: knock-relay
  namespace: knock
type: Opaque
stringData:
  # 32+ random bytes: openssl rand -base64 48. Keeps sign-ins and door claims
  # valid across restarts; changing it signs everyone out.
  KNOCK_TOKEN_SECRET: "change-me"
  # Sign-in, brokered by the relay. Setup: docs/RELAY_SIGN_IN.md.
  # Callback URLs: KNOCK_PUBLIC_URL + /v1/auth/google/callback and /v1/auth/github/callback.
  # Leave both empty for an anonymous-only relay.
  KNOCK_GOOGLE_CLIENT_ID: ""      # e.g. 1234567890-abc.apps.googleusercontent.com
  KNOCK_GOOGLE_CLIENT_SECRET: ""  # e.g. GOCSPX-...
  KNOCK_GITHUB_CLIENT_ID: ""      # e.g. Ov23li...
  KNOCK_GITHUB_CLIENT_SECRET: ""
  # Door store: "memory" (default) or "valkey". The URL can carry a password;
  # knockd never logs it. e.g. redis://:password@valkey.knock.svc:6379/0
  KNOCK_STORE: "memory"
  KNOCK_VALKEY_URL: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knock-relay
  namespace: knock
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: knock-relay}
  template:
    metadata:
      labels: {app: knock-relay}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: knockd
          image: ghcr.io/idestis/knock-relay:latest
          ports:
            - {name: http, containerPort: 8787}
          envFrom:
            - secretRef: {name: knock-relay}
          env:
            - {name: KNOCK_PUBLIC_URL, value: "https://knock.example.ts.net"}
            # Empty: anonymous only when no provider is set; once one is, sign-in
            # is required. "true" keeps anonymous use next to sign-in.
            - {name: KNOCK_ALLOW_ANONYMOUS, value: ""}
            # Optional restrictions, checked at sign-in. Changing one signs out
            # everyone who signed in under the old value.
            - {name: KNOCK_GOOGLE_DOMAIN, value: ""}   # e.g. example.com (Workspace accounts only)
            - {name: KNOCK_GITHUB_ORG, value: ""}      # e.g. example-org (active members only)
            - {name: KNOCK_DRAIN_GRACE, value: "50s"}
            # How long a door whose host left stays known before its id is free.
            - {name: KNOCK_DOOR_TTL, value: "24h"}
            # Proxies whose X-Forwarded-For is believed (CIDRs, comma-separated).
            # Keep it empty here: the Tailscale proxy is L4 and sets no header, so
            # any X-Forwarded-For a client sends is made up. Behind an HTTP
            # ingress, set it to the ingress controller's pod CIDR.
            - {name: KNOCK_TRUSTED_PROXIES, value: ""}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: knock-relay
  namespace: knock
  annotations:
    # Tailscale Kubernetes operator: exposes the relay on your tailnet only.
    tailscale.com/expose: "true"
    tailscale.com/hostname: "knock"
spec:
  selector: {app: knock-relay}
  ports:
    - {name: http, port: 443, targetPort: http}
